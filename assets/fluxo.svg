<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Fluxo da decisão: sensor, valor, condição e ação">
  <style>
    .t{font-family:"Trebuchet MS",Verdana,sans-serif}
    .n{fill:#F8FAFB;stroke:#C5D2DA;stroke-width:3}
    .a{stroke:#C5D2DA;stroke-width:4;fill:none}
    .n1{animation:on1 8s infinite}.n2{animation:on2 8s infinite}.n3{animation:on3 8s infinite}.n4{animation:on4 8s infinite}
    .a1{animation:on2 8s infinite}.a2{animation:on3 8s infinite}.a3{animation:on4 8s infinite}
    @keyframes on1{0%,2%{fill:#F8FAFB;stroke:#C5D2DA}5%,100%{fill:#DDF1EE;stroke:#0B7A6D}}
    @keyframes on2{0%,22%{fill:#F8FAFB;stroke:#C5D2DA}25%,100%{fill:#DDF1EE;stroke:#0B7A6D}}
    @keyframes on3{0%,42%{fill:#F8FAFB;stroke:#C5D2DA}45%,100%{fill:#DDF1EE;stroke:#0B7A6D}}
    @keyframes on4{0%,62%{fill:#F8FAFB;stroke:#C5D2DA}65%,100%{fill:#FFE9B8;stroke:#C98A00}}
    .reset{animation:rs 8s infinite}
    @keyframes rs{0%,92%{opacity:0}96%,100%{opacity:1}}
  </style>
  <rect width="1000" height="220" rx="16" fill="#EAF0F3"/>
  <rect class="n n1" x="40" y="70" width="190" height="80" rx="14"/>
  <rect class="n n2" x="290" y="70" width="190" height="80" rx="14"/>
  <rect class="n n3" x="540" y="70" width="190" height="80" rx="14"/>
  <rect class="n n4" x="790" y="70" width="170" height="80" rx="14"/>
  <path class="a a1" d="M232 110H288"/><path class="a a2" d="M482 110H538"/><path class="a a3" d="M732 110H788"/>
  <g class="t" fill="#13232E" text-anchor="middle">
    <text x="135" y="104" font-size="24" font-weight="800">1 · Sensor</text><text x="135" y="132" font-size="17" fill="#51656F">mede a luz</text>
    <text x="385" y="104" font-size="24" font-weight="800">2 · Valor</text><text x="385" y="132" font-size="17" fill="#51656F">luz = 30</text>
    <text x="635" y="104" font-size="24" font-weight="800">3 · Condição</text><text x="635" y="132" font-size="17" fill="#51656F">30 &lt; 50 ? verdadeiro</text>
    <text x="875" y="104" font-size="24" font-weight="800">4 · Ação</text><text x="875" y="132" font-size="17" fill="#51656F">acender a lâmpada</text>
  </g>
</svg>
