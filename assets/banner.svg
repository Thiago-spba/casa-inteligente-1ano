<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Casa Inteligente: uma pessoa passa pelo corredor, o sensor percebe e a lâmpada acende">
  <style>
    .t{font-family:"Trebuchet MS",Verdana,sans-serif}
    .m{font-family:"Courier New",Consolas,monospace}
    .person{animation:walk 8s linear infinite}
    .glow{opacity:0;animation:glow 8s linear infinite}
    .bulb{fill:#2A3E4B;animation:bulb 8s linear infinite}
    .zone{animation:zone 8s linear infinite}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(380px)}}
    @keyframes glow{0%,31%{opacity:0}34%,66%{opacity:.45}69%,100%{opacity:0}}
    @keyframes bulb{0%,31%{fill:#2A3E4B}34%,66%{fill:#F2A20C}69%,100%{fill:#2A3E4B}}
    @keyframes zone{0%,31%{opacity:.12}34%,66%{opacity:.3}69%,100%{opacity:.12}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="320" fill="#0E1F2B"/>
  <rect width="1280" height="320" fill="url(#g)"/>
  <rect x="0" y="312" width="1280" height="8" fill="#F2A20C"/>
  <text class="t" x="60" y="120" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">CASA INTELIGENTE</text>
  <text class="t" x="60" y="166" font-size="24" fill="#9BD9CF">Robótica · 1º ano do Ensino Médio · micro:bit</text>
  <text class="m" x="60" y="238" font-size="26" font-weight="700" fill="#F2A20C">SE luz &lt; 50 ENTÃO acender<tspan class="caret" fill="#FFFFFF"> ▌</tspan></text>
  <text class="m" x="60" y="274" font-size="26" font-weight="700" fill="#3CC9B5">SENÃO apagar</text>
  <rect x="740" y="60" width="480" height="200" rx="6" fill="#14232E" stroke="#3CC9B5" stroke-width="4"/>
  <polygon class="zone" points="980,72 890,258 1070,258" fill="#3CC9B5"/>
  <rect x="968" y="62" width="24" height="10" rx="3" fill="#E7EFF3"/>
  <circle class="glow" cx="980" cy="120" r="62" fill="#F2A20C"/>
  <circle class="bulb" cx="980" cy="120" r="12" stroke="#E7EFF3" stroke-width="3"/>
  <g transform="translate(790,232)"><g class="person"><circle cx="0" cy="-20" r="8" fill="#E7EFF3"/><rect x="-8" y="-10" width="16" height="28" rx="7" fill="#E7EFF3"/></g></g>
</svg>
